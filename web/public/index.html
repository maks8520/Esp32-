<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VOSTOK NEXUS v5.1 ULTRA</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div class="noise-overlay"></div>
    <div class="scanlines"></div>
    <div class="bg-gradient"></div>

    <main id="app">
        <header class="glass-header">
            <div class="status-bar">
                <span class="brand">VOSTOK NEXUS <span class="version">v5.1</span></span>
                <div class="indicators">
                    <span id="conn-status" class="dot"></span>
                    <span id="time-sync">12:45</span>
                </div>
            </div>
        </header>

        <section id="content">
            <!-- Dashboard Tab -->
            <div id="tab-dashboard" class="tab-content active">
                <div class="predictor-container">
                    <div class="glass-card predictor-card">
                        <h3>AI BITE PREDICTOR</h3>
                        <div class="gauge-wrapper">
                            <div class="gauge-glow"></div>
                            <canvas id="predictorGauge"></canvas>
                            <div class="gauge-value"><span id="predict-pct">88</span>%</div>
                        </div>
                        <div class="scanner-line"></div>
                    </div>
                </div>

                <div class="rods-grid">
                    <div class="glass-card rod-card" id="rod-1">
                        <div class="rod-header">
                            <span class="label">ROD 01</span>
                            <span class="battery">92%</span>
                        </div>
                        <div class="rod-visual">
                            <div class="rod-line"></div>
                        </div>
                        <div class="rod-data">
                            <div class="val">0.02<span class="unit">G</span></div>
                            <div class="val">512<span class="unit">H</span></div>
                        </div>
                    </div>
                    <div class="glass-card rod-card" id="rod-2">
                        <div class="rod-header">
                            <span class="label">ROD 02</span>
                            <span class="battery">88%</span>
                        </div>
                        <div class="rod-visual">
                            <div class="rod-line"></div>
                        </div>
                        <div class="rod-data">
                            <div class="val">0.01<span class="unit">G</span></div>
                            <div class="val">508<span class="unit">H</span></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Meteo Tab -->
            <div id="tab-meteo" class="tab-content">
                <div class="glass-card map-card">
                    <div id="map"></div>
            <!-- Profile Tab -->
            <div id="tab-profile" class="tab-content">
                <div class="glass-card profile-card">
                    <h3>VERTICAL METEO PROFILE</h3>
                    <div class="profile-container">
                        <canvas id="meteoProfileChart"></canvas>
                        <div class="profile-table">
                            <div class="row header"><span>Alt</span><span>Temp</span><span>Wind</span></div>
                            <div id="profile-rows"></div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- Fishing Tab -->
            <div id="tab-fishing" class="tab-content">
                <div class="glass-card timeline-card">
                    <h3>BITE TIMELINE</h3>
                    <div id="bite-timeline" class="timeline"></div>
                </div>
                <button class="glass-card fish-id-btn" onclick="openFishID()">
                    <span>📸</span> AI FISH ID
                </button>
            </div>
            <!-- Settings Tab -->
            <div id="tab-settings" class="tab-content">
                <div class="settings-scroll">
                    <div class="glass-card setting-group">
                        <h4>Connection & Network</h4>
                        <div class="setting-item"><span>WiFi SSID</span><input type="text" value="VOSTOK_NEXUS"></div>
                    </div>
                    <div class="glass-card setting-group">
                        <h4>Sensor Calibration</h4>
                        <div class="setting-item"><span>Rod 1 Sensitivity</span><input type="range"></div>
                    </div>
                    <div class="glass-card setting-group danger">
                        <h4>Danger Zone</h4>
                        <button class="reset-btn">FACTORY RESET</button>
                    </div>
                </div>
            </div>
            <!-- Fish ID Modal -->
            <div id="fish-id-modal" class="modal-overlay">
                <div class="glass-card modal-content">
                    <div class="scan-frame">
                        <div class="laser-line"></div>
                        <img src="" id="fish-preview" class="hidden">
                    </div>
                    <div id="scan-status">SCANNING TARGET...</div>
                    <button onclick="closeFishID()">CLOSE</button>
                </div>
            </div>
                </div>
                <div class="meteo-details grid-2">
                    <div class="glass-card mini-card">
                        <span class="label">WIND</span>
                        <div class="val">4.2 <small>m/s</small></div>
                    </div>
                    <div class="glass-card mini-card">
                        <span class="label">PRESSURE</span>
                        <div class="val">1012 <small>hPa</small></div>
                    </div>
                </div>
            </div>
        </section>

        <nav class="bottom-nav glass">
            <button class="nav-item active" data-tab="dashboard">
                <span class="icon">⛯</span>
                <span class="label">DASH</span>
            </button>
            <button class="nav-item" data-tab="meteo">
                <span class="icon">☁</span>
                <span class="label">METEO</span>
            </button>
            <button class="nav-item" data-tab="profile">
                <span class="icon">☱</span>
                <span class="label">PROF</span>
            </button>
            <button class="nav-item" data-tab="fishing">
                <span class="icon">⚓</span>
                <span class="label">FISH</span>
            </button>
            <button class="nav-item" data-tab="settings">
                <span class="icon">⚙</span>
                <span class="label">SET</span>
            </button>
        </nav>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="script.js"></script>
</body>
</html>
