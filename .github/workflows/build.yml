name: ESP-IDF CI Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-base:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.1
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Build Base Station (ESP32-S3)
        working-directory: vostok-nexus-v5-1
        run: |
          . $IDF_PATH/export.sh
          idf.py set-target esp32s3
          idf.py build

      - name: Upload Base Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: base-station-firmware
          path: |
            vostok-nexus-v5-1/build/bootloader/bootloader.bin
            vostok-nexus-v5-1/build/partition_table/partition-table.bin
            vostok-nexus-v5-1/build/vostok-nexus-base.bin

  build-rod:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.1
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Build Rod Station (ESP32-C3)
        working-directory: vostok-nexus-v5-1/rod_firmware
        run: |
          . $IDF_PATH/export.sh
          idf.py set-target esp32c3
          idf.py build

      - name: Upload Rod Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rod-station-firmware
          path: |
            vostok-nexus-v5-1/rod_firmware/build/bootloader/bootloader.bin
            vostok-nexus-v5-1/rod_firmware/build/partition_table/partition-table.bin
            vostok-nexus-v5-1/rod_firmware/build/vostok-nexus-rod.bin
