name: ESP-IDF CI Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-base:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.1

    defaults:
  run:
    shell: bash # Это заставит все шаги использовать Bash
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Cache ESP-IDF components
        uses: actions/cache@v3
        with:
          path: |
            ~/.espressif
            vostok-nexus-v5-1/managed_components
            vostok-nexus-v5-1/dependencies.lock
          key: ${{ runner.os }}-esp-idf-base-${{ hashFiles('vostok-nexus-v5-1/main/idf_component.yml') }}
      
      - name: Clean build artifacts
       run: |
          rm -rf vostok-nexus-v5-1/build
          rm -f vostok-nexus-v5-1/dependencies.lock
          rm -rf vostok-nexus-v5-1/managed_components
    
      - name: Build Base Station (ESP32-S3)
        working-directory: vostok-nexus-v5-1
        run: |
          . $IDF_PATH/export.sh
          idf.py set-target esp32s3
          idf.py build

      - name: Upload Base Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: base-station-firmware
          path: |
            vostok-nexus-v5-1/build/*.bin
            vostok-nexus-v5-1/build/bootloader/*.bin
            vostok-nexus-v5-1/build/partition_table/*.bin

  build-rod:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.1
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Cache ESP-IDF components
        uses: actions/cache@v3
        with:
          path: |
            ~/.espressif
            vostok-nexus-v5-1/rod_firmware/managed_components
            vostok-nexus-v5-1/rod_firmware/dependencies.lock
          key: ${{ runner.os }}-esp-idf-rod-${{ hashFiles('vostok-nexus-v5-1/rod_firmware/main/idf_component.yml') }}

      - name: Build Rod Station (ESP32-C3)
        working-directory: vostok-nexus-v5-1/rod_firmware
        run: |
          . $IDF_PATH/export.sh
          idf.py set-target esp32c3
          idf.py build

      - name: Upload Rod Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rod-station-firmware
          path: |
            vostok-nexus-v5-1/rod_firmware/build/*.bin
            vostok-nexus-v5-1/rod_firmware/build/bootloader/*.bin
            vostok-nexus-v5-1/rod_firmware/build/partition_table/*.bin
